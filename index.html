<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mundo Creativo - Casa y Taller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior de herramientas y personalización -->
  <header class="panel-control">
    <div class="grupo-botones">
      <button onclick="cambiarGenero('nina')" id="btn-nina" class="activo">👧 Niña</button>
      <button onclick="cambiarGenero('nino')" id="btn-nino">👦 Niño</button>
      <button onclick="cambiarPiel()">🎨 Piel</button>
      <button onclick="cambiarPelo()">💇 Peinado</button>
      <button onclick="cambiarExpresion()">😄 Cara</button>
    </div>
    <div class="grupo-botones">
      <button onclick="reiniciarTodo()" class="btn-secundario">🔄 Ordenar Casa</button>
    </div>
  </header>

  <!-- Escenario completo -->
  <main id="casa-contenedor">
    <div id="casa">
      
      <!-- ==================== HABITACIÓN 1: DORMITORIO Y ESTUDIO ==================== -->
      <section class="habitacion dormitorio" id="dormitorio">
        
        <!-- Ventana interactiva Día/Noche -->
        <div id="ventana" onclick="alternarDiaNoche()" title="Toca para cambiar Día/Noche">
          <div class="cielo-ventana" id="cielo-ventana">
            <div class="astro"></div>
            <div class="estrella e1">✦</div>
            <div class="estrella e2">✦</div>
          </div>
          <div class="marco-ventana"></div>
        </div>

        <!-- Estantería con Radio Musical -->
        <div class="estanteria">
          <div id="radio" onclick="alternarRadio()" title="Toca para poner música">
            <svg width="85" height="60" viewBox="0 0 85 60">
              <line x1="15" y1="18" x2="55" y2="3" stroke="#555" stroke-width="3" stroke-linecap="round"/>
              <rect x="5" y="18" width="75" height="40" rx="10" fill="#FF6B6B" stroke="#C92A2A" stroke-width="2"/>
              <circle cx="24" cy="38" r="12" fill="#2B2D42"/>
              <circle cx="24" cy="38" r="5" fill="#8D99AE"/>
              <rect x="44" y="26" width="28" height="10" rx="3" fill="#FFF3BF"/>
              <circle cx="50" cy="46" r="4" fill="#FFD166"/>
              <circle cx="65" cy="46" r="4" fill="#FFD166"/>
            </svg>
            <span id="notas-musicales" class="oculto">🎵 🎶</span>
          </div>
        </div>

        <!-- Armario mágico que se abre y guarda ropa/accesorios -->
        <div id="armario-contenedor">
          <div class="armario-interior">
            <div class="barra-perchas"></div>
          </div>
          <div id="puerta-armario" onclick="alternarArmario()" title="Toca para abrir el armario">
            <div class="pomo-armario"></div>
            <span>👗</span>
          </div>
        </div>

        <!-- Caballete de Pintura Interactivo (Toca el lienzo para pintar) -->
        <div id="caballete" onclick="pintarCuadro()" title="Toca el lienzo para pintar">
          <svg width="110" height="150" viewBox="0 0 110 150">
            <line x1="55" y1="10" x2="20" y2="145" stroke="#8D5524" stroke-width="6" stroke-linecap="round"/>
            <line x1="55" y1="10" x2="90" y2="145" stroke="#8D5524" stroke-width="6" stroke-linecap="round"/>
            <line x1="55" y1="10" x2="55" y2="140" stroke="#6F431C" stroke-width="6" stroke-linecap="round"/>
            <rect x="18" y="25" width="74" height="65" rx="4" fill="#FFFFFF" stroke="#D4A373" stroke-width="4"/>
            <g id="dibujo-lienzo"></g>
            <rect x="12" y="90" width="86" height="8" rx="3" fill="#B08968"/>
          </svg>
        </div>

        <!-- Alfombra -->
        <div class="alfombra"></div>

        <!-- Cama interactiva -->
        <div id="cama">
          <svg width="240" height="150" viewBox="0 0 240 150">
            <rect x="10" y="20" width="20" height="120" rx="8" fill="#8D5524"/>
            <rect x="210" y="55" width="20" height="85" rx="8" fill="#8D5524"/>
            <rect x="25" y="70" width="190" height="45" rx="10" fill="#FFF"/>
            <ellipse cx="55" cy="68" rx="25" ry="12" fill="#E2ECE9"/>
            <rect x="20" y="105" width="200" height="22" rx="6" fill="#B08968"/>
          </svg>
          <div id="edredon"></div>
          <span id="zzz" class="oculto">zZz...</span>
        </div>

        <!-- Objetos arrastrables del Dormitorio (Ropa dentro del armario + Juguetes) -->
        <div id="vestido-rojo" class="arrastrable prenda oculto-puerta" data-sup="#EF476F" data-inf="#EF476F" style="left: 445px; top: 185px;">
          <svg width="55" height="65" viewBox="0 0 55 65">
            <path d="M15 10 H40 L48 58 H7 Z" fill="#EF476F" stroke="#C9184A" stroke-width="2"/>
          </svg>
        </div>

        <div id="conjunto-verde" class="arrastrable prenda oculto-puerta" data-sup="#06D6A0" data-inf="#118AB2" style="left: 505px; top: 185px;">
          <svg width="55" height="65" viewBox="0 0 55 65">
            <rect x="12" y="8" width="31" height="26" rx="4" fill="#06D6A0"/>
            <rect x="14" y="34" width="27" height="24" rx="3" fill="#118AB2"/>
          </svg>
        </div>

        <div id="corona" class="arrastrable accesorio oculto-puerta" style="left: 470px; top: 270px;">
          <svg width="56" height="36" viewBox="0 0 56 36">
            <polygon points="6,30 10,8 22,20 28,4 34,20 46,8 50,30" fill="#FFD166" stroke="#F4A261" stroke-width="2"/>
          </svg>
        </div>

        <div id="peluche" class="arrastrable juguete" style="left: 235px; top: 375px;">
          <svg width="50" height="55" viewBox="0 0 50 55">
            <circle cx="15" cy="14" r="7" fill="#B08968"/>
            <circle cx="35" cy="14" r="7" fill="#B08968"/>
            <circle cx="25" cy="22" r="14" fill="#DDA15E"/>
            <ellipse cx="25" cy="42" rx="13" ry="11" fill="#DDA15E"/>
            <circle cx="21" cy="20" r="2" fill="#2B2D42"/>
            <circle cx="29" cy="20" r="2" fill="#2B2D42"/>
            <circle cx="25" cy="24" r="2.5" fill="#5C3A21"/>
          </svg>
        </div>
      </section>

      <!-- Pared divisoria -->
      <div class="arco-divisor"></div>

      <!-- ==================== HABITACIÓN 2: COCINA ==================== -->
      <section class="habitacion cocina" id="cocina">
        
        <!-- Encimera, Fogón y Sartén -->
        <div class="encimera">
          <div class="fogon">
            <div class="llama" id="llama-fogon"></div>
          </div>
          <div id="sarten">
            <svg width="120" height="50" viewBox="0 0 120 50">
              <rect x="78" y="20" width="40" height="9" rx="4" fill="#495057"/>
              <path d="M8 16 H82 L74 38 H16 Z" fill="#212529"/>
            </svg>
          </div>
        </div>

        <!-- Nevera interactiva -->
        <div id="nevera-contenedor">
          <div class="nevera-interior">
            <div class="balda"></div>
            <div class="balda" style="top: 130px;"></div>
          </div>
          <div id="puerta-nevera" onclick="alternarNevera()" title="Toca para abrir/cerrar la nevera">
            <div class="tirador"></div>
            <div class="iman-corazon">❤️</div>
          </div>
        </div>

        <!-- Mesa de comedor -->
        <div class="mesa-cocina"></div>

        <!-- Alimentos (Ocultos hasta abrir la nevera + Frutero en la mesa) -->
        <div id="huevo" class="arrastrable comida oculto-nevera" data-estado="crudo" style="left: 965px; top: 165px;">
          <svg width="42" height="48" viewBox="0 0 42 48">
            <ellipse cx="21" cy="26" rx="15" ry="19" fill="#FFF3E0" stroke="#E0C097" stroke-width="2"/>
          </svg>
        </div>

        <div id="fresa" class="arrastrable comida oculto-nevera" style="left: 1015px; top: 170px;">
          <svg width="40" height="45" viewBox="0 0 40 45">
            <path d="M10 15 Q20 42 30 15 Q20 10 10 15 Z" fill="#FF4D6D"/>
            <path d="M12 14 L20 8 L28 14 Z" fill="#2EC4B6"/>
            <circle cx="17" cy="22" r="1.5" fill="#FFF"/>
            <circle cx="23" cy="24" r="1.5" fill="#FFF"/>
          </svg>
        </div>

        <div id="leche" class="arrastrable comida oculto-nevera" style="left: 980px; top: 245px;">
          <svg width="42" height="60" viewBox="0 0 42 60">
            <polygon points="10,15 32,15 36,24 6,24" fill="#4EA8DE"/>
            <rect x="6" y="24" width="30" height="32" rx="3" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
            <rect x="6" y="34" width="30" height="10" fill="#4EA8DE"/>
          </svg>
        </div>

        <!-- Manzana visible sobre la mesa desde el principio -->
        <div id="manzana" class="arrastrable comida" style="left: 1160px; top: 265px;">
          <svg width="44" height="44" viewBox="0 0 44 44">
            <circle cx="22" cy="24" r="16" fill="#EF476F"/>
            <path d="M22 8 Q26 2 32 5" stroke="#06D6A0" stroke-width="4" fill="none" stroke-linecap="round"/>
          </svg>
        </div>

      </section>

      <!-- ==================== EL AVATAR REDISEÑADO ==================== -->
      <div id="avatar" class="arrastrable" style="left: 310px; top: 230px;">
        <svg width="150" height="250" viewBox="0 0 150 250">
          <!-- Pelo trasero -->
          <g id="capa-pelo-trasero"></g>

          <!-- Piernas y Zapatos -->
          <g id="capa-piernas">
            <rect x="52" y="175" width="16" height="50" rx="8" class="piel" fill="#F8C8A0"/>
            <rect x="82" y="175" width="16" height="50" rx="8" class="piel" fill="#F8C8A0"/>
            <rect x="48" y="218" width="24" height="14" rx="7" fill="#FF6B6B"/>
            <rect x="78" y="218" width="24" height="14" rx="7" fill="#FF6B6B"/>
          </g>

          <!-- Brazos -->
          <g id="capa-brazos">
            <rect x="33" y="112" width="15" height="52" rx="7" transform="rotate(12 33 112)" class="piel" fill="#F8C8A0"/>
            <rect x="102" y="112" width="15" height="52" rx="7" transform="rotate(-12 102 112)" class="piel" fill="#F8C8A0"/>
          </g>

          <!-- Torso y Ropa -->
          <g id="capa-ropa">
            <path d="M46 110 Q75 105 104 110 L108 162 H42 Z" fill="#FF8FA3" id="prenda-superior"/>
            <path d="M43 160 H107 L113 188 H37 Z" fill="#4EA8DE" id="prenda-inferior"/>
          </g>

          <!-- Cuello y Cabeza -->
          <g id="capa-cabeza">
            <rect x="66" y="95" width="18" height="18" rx="6" class="piel" fill="#F8C8A0"/>
            <circle cx="32" cy="65" r="8" class="piel" fill="#F8C8A0"/>
            <circle cx="118" cy="65" r="8" class="piel" fill="#F8C8A0"/>
            <rect x="34" y="22" width="82" height="78" rx="38" class="piel" fill="#F8C8A0"/>
          </g>

          <!-- Rasgos Faciales Expresivos -->
          <g id="capa-cara">
            <path d="M48 48 Q55 44 62 48" stroke="#5C3A21" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M88 48 Q95 44 102 48" stroke="#5C3A21" stroke-width="3" fill="none" stroke-linecap="round"/>
            
            <g id="ojos-abiertos">
              <circle cx="55" cy="62" r="7" fill="#2B2D42"/>
              <circle cx="53" cy="59" r="2.5" fill="#FFF"/>
              <circle cx="95" cy="62" r="7" fill="#2B2D42"/>
              <circle cx="93" cy="59" r="2.5" fill="#FFF"/>
            </g>

            <g id="ojos-cerrados" style="display: none;">
              <path d="M47 63 Q55 70 63 63" stroke="#2B2D42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <path d="M87 63 Q95 70 103 63" stroke="#2B2D42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </g>

            <ellipse cx="45" cy="72" rx="6" ry="3.5" fill="#FF8FA3" opacity="0.6"/>
            <ellipse cx="105" cy="72" rx="6" ry="3.5" fill="#FF8FA3" opacity="0.6"/>

            <path id="boca" d="M67 76 Q75 85 83 76" stroke="#C92A2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>

          <!-- Flequillo / Pelo frontal -->
          <g id="capa-pelo-frontal"></g>

          <!-- Corona puesta (oculta hasta arrastrar la corona al avatar) -->
          <g id="corona-puesta" style="display: none;">
            <polygon points="48,22 52,4 65,14 75,0 85,14 98,4 102,22" fill="#FFD166" stroke="#F4A261" stroke-width="2"/>
          </g>
        </svg>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
