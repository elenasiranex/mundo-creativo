<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mundo Creativo - Casa Interactiva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="panel-control">
    <div class="grupo-botones">
      <button onclick="cambiarGenero('nina')" id="btn-nina" class="activo">👧 Niña</button>
      <button onclick="cambiarGenero('nino')" id="btn-nino">👦 Niño</button>
      <button onclick="cambiarPiel()">🎨 Piel</button>
      <button onclick="cambiarPelo()">💇 Peinado</button>
      <button onclick="cambiarExpresion()">😄 Cara</button>
    </div>
    <button onclick="reiniciarTodo()" class="btn-secundario">🔄 Ordenar Casa</button>
  </header>

  <main id="casa">
    
    <!-- ==================== DORMITORIO (Mitad izquierda) ==================== -->
    <section class="habitacion dormitorio">
      
      <!-- Ventana (Arriba izquierda) -->
      <div id="ventana" onclick="alternarDiaNoche()" title="Cambiar Día/Noche">
        <div class="cielo-ventana" id="cielo-ventana">
          <div class="astro"></div>
          <span class="estrella e1">✦</span>
          <span class="estrella e2">✦</span>
        </div>
        <div class="marco-ventana"></div>
      </div>

      <!-- Estantería con Radio (Arriba centro) -->
      <div class="estanteria">
        <div id="radio" onclick="alternarRadio()" title="Encender/Apagar Radio">
          <svg width="80" height="55" viewBox="0 0 85 60">
            <line x1="15" y1="18" x2="55" y2="3" stroke="#555" stroke-width="3" stroke-linecap="round"/>
            <rect x="5" y="18" width="75" height="40" rx="10" fill="#FF6B6B" stroke="#C92A2A" stroke-width="2"/>
            <circle cx="24" cy="38" r="12" fill="#2B2D42"/>
            <circle cx="24" cy="38" r="5" fill="#8D99AE"/>
            <rect x="44" y="26" width="28" height="10" rx="3" fill="#FFF3BF"/>
            <circle cx="50" cy="46" r="4" fill="#FFD166"/>
            <circle cx="65" cy="46" r="4" fill="#FFD166"/>
          </svg>
          <span id="notas-musicales" class="oculto">🎵 🎶</span>
        </div>
      </div>

      <!-- Armario (Arriba derecha del dormitorio) -->
      <div id="armario">
        <div class="armario-interior">
          <div class="barra-perchas"></div>
        </div>
        <div id="puerta-armario" onclick="alternarArmario()" title="Abrir/Cerrar Armario">
          <div class="pomo-armario"></div>
          <span>👗</span>
        </div>
      </div>

      <!-- Caballete (Entre ventana y cama, sin pisar nada) -->
      <div id="caballete" onclick="pintarCuadro()" title="Toca para pintar">
        <svg width="95" height="130" viewBox="0 0 110 150">
          <line x1="55" y1="10" x2="20" y2="145" stroke="#8D5524" stroke-width="6" stroke-linecap="round"/>
          <line x1="55" y1="10" x2="90" y2="145" stroke="#8D5524" stroke-width="6" stroke-linecap="round"/>
          <line x1="55" y1="10" x2="55" y2="140" stroke="#6F431C" stroke-width="6" stroke-linecap="round"/>
          <rect x="18" y="25" width="74" height="65" rx="4" fill="#FFFFFF" stroke="#D4A373" stroke-width="4"/>
          <g id="dibujo-lienzo"></g>
          <rect x="12" y="90" width="86" height="8" rx="3" fill="#B08968"/>
        </svg>
      </div>

      <!-- Alfombra y Cama (Abajo izquierda) -->
      <div class="alfombra"></div>
      <div id="cama">
        <svg width="220" height="140" viewBox="0 0 240 150">
          <rect x="10" y="20" width="20" height="120" rx="8" fill="#8D5524"/>
          <rect x="210" y="55" width="20" height="85" rx="8" fill="#8D5524"/>
          <rect x="25" y="70" width="190" height="45" rx="10" fill="#FFF"/>
          <ellipse cx="55" cy="68" rx="25" ry="12" fill="#E2ECE9"/>
          <rect x="20" y="105" width="200" height="22" rx="6" fill="#B08968"/>
        </svg>
        <div id="edredon"></div>
        <span id="zzz" class="oculto">zZz...</span>
      </div>

    </section>

    <div class="arco-divisor"></div>

    <!-- ==================== COCINA (Mitad derecha) ==================== -->
    <section class="habitacion cocina">
      
      <!-- Encimera y Sartén -->
      <div class="encimera">
        <div class="fogon">
          <div class="llama" id="llama-fogon"></div>
        </div>
        <div id="sarten">
          <svg width="110" height="45" viewBox="0 0 120 50">
            <rect x="78" y="20" width="40" height="9" rx="4" fill="#495057"/>
            <path d="M8 16 H82 L74 38 H16 Z" fill="#212529"/>
          </svg>
        </div>
      </div>

      <!-- Nevera -->
      <div id="nevera">
        <div class="nevera-interior">
          <div class="balda"></div>
          <div class="balda" style="top: 125px;"></div>
        </div>
        <div id="puerta-nevera" onclick="alternarNevera()" title="Abrir/Cerrar Nevera">
          <div class="tirador"></div>
          <div class="iman-corazon">❤️</div>
        </div>
      </div>

      <!-- Mesa de comedor -->
      <div class="mesa-cocina"></div>

    </section>

    <!-- ==================== ELEMENTOS ARRASTRABLES (Se posicionan automáticamente dentro de cada mueble) ==================== -->
    
    <!-- Ropa y Corona (Dentro del Armario) -->
    <div id="vestido-rojo" class="arrastrable prenda item-armario" data-sup="#EF476F" data-inf="#EF476F">
      <svg width="48" height="58" viewBox="0 0 55 65">
        <path d="M15 10 H40 L48 58 H7 Z" fill="#EF476F" stroke="#C9184A" stroke-width="2"/>
      </svg>
    </div>

    <div id="conjunto-verde" class="arrastrable prenda item-armario" data-sup="#06D6A0" data-inf="#118AB2">
      <svg width="48" height="58" viewBox="0 0 55 65">
        <rect x="12" y="8" width="31" height="26" rx="4" fill="#06D6A0"/>
        <rect x="14" y="34" width="27" height="24" rx="3" fill="#118AB2"/>
      </svg>
    </div>

    <div id="corona" class="arrastrable accesorio item-armario">
      <svg width="50" height="32" viewBox="0 0 56 36">
        <polygon points="6,30 10,8 22,20 28,4 34,20 46,8 50,30" fill="#FFD166" stroke="#F4A261" stroke-width="2"/>
      </svg>
    </div>

    <!-- Peluche (En la alfombra) -->
    <div id="peluche" class="arrastrable juguete">
      <svg width="48" height="52" viewBox="0 0 50 55">
        <circle cx="15" cy="14" r="7" fill="#B08968"/>
        <circle cx="35" cy="14" r="7" fill="#B08968"/>
        <circle cx="25" cy="22" r="14" fill="#DDA15E"/>
        <ellipse cx="25" cy="42" rx="13" ry="11" fill="#DDA15E"/>
        <circle cx="21" cy="20" r="2" fill="#2B2D42"/>
        <circle cx="29" cy="20" r="2" fill="#2B2D42"/>
        <circle cx="25" cy="24" r="2.5" fill="#5C3A21"/>
      </svg>
    </div>

    <!-- Alimentos (Dentro de la Nevera + Manzana en la Mesa) -->
    <div id="huevo" class="arrastrable comida item-nevera" data-estado="crudo">
      <svg width="38" height="44" viewBox="0 0 42 48">
        <ellipse cx="21" cy="26" rx="15" ry="19" fill="#FFF3E0" stroke="#E0C097" stroke-width="2"/>
      </svg>
    </div>

    <div id="fresa" class="arrastrable comida item-nevera">
      <svg width="36" height="40" viewBox="0 0 40 45">
        <path d="M10 15 Q20 42 30 15 Q20 10 10 15 Z" fill="#FF4D6D"/>
        <path d="M12 14 L20 8 L28 14 Z" fill="#2EC4B6"/>
        <circle cx="17" cy="22" r="1.5" fill="#FFF"/>
        <circle cx="23" cy="24" r="1.5" fill="#FFF"/>
      </svg>
    </div>

    <div id="leche" class="arrastrable comida item-nevera">
      <svg width="38" height="54" viewBox="0 0 42 60">
        <polygon points="10,15 32,15 36,24 6,24" fill="#4EA8DE"/>
        <rect x="6" y="24" width="30" height="32" rx="3" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
        <rect x="6" y="34" width="30" height="10" fill="#4EA8DE"/>
      </svg>
    </div>

    <div id="manzana" class="arrastrable comida">
      <svg width="42" height="42" viewBox="0 0 44 44">
        <circle cx="22" cy="24" r="16" fill="#EF476F"/>
        <path d="M22 8 Q26 2 32 5" stroke="#06D6A0" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- ==================== AVATAR ==================== -->
    <div id="avatar" class="arrastrable">
      <svg width="140" height="235" viewBox="0 0 150 250">
        <g id="capa-pelo-trasero"></g>

        <g id="capa-piernas">
          <rect x="52" y="175" width="16" height="50" rx="8" class="piel" fill="#F8C8A0"/>
          <rect x="82" y="175" width="16" height="50" rx="8" class="piel" fill="#F8C8A0"/>
          <rect x="48" y="218" width="24" height="14" rx="7" fill="#FF6B6B"/>
          <rect x="78" y="218" width="24" height="14" rx="7" fill="#FF6B6B"/>
        </g>

        <g id="capa-brazos">
          <rect x="33" y="112" width="15" height="52" rx="7" transform="rotate(12 33 112)" class="piel" fill="#F8C8A0"/>
          <rect x="102" y="112" width="15" height="52" rx="7" transform="rotate(-12 102 112)" class="piel" fill="#F8C8A0"/>
        </g>

        <g id="capa-ropa">
          <path d="M46 110 Q75 105 104 110 L108 162 H42 Z" fill="#FF8FA3" id="prenda-superior"/>
          <path d="M43 160 H107 L113 188 H37 Z" fill="#4EA8DE" id="prenda-inferior"/>
        </g>

        <g id="capa-cabeza">
          <rect x="66" y="95" width="18" height="18" rx="6" class="piel" fill="#F8C8A0"/>
          <circle cx="32" cy="65" r="8" class="piel" fill="#F8C8A0"/>
          <circle cx="118" cy="65" r="8" class="piel" fill="#F8C8A0"/>
          <rect x="34" y="24" width="82" height="76" rx="38" class="piel" fill="#F8C8A0"/>
        </g>

        <g id="capa-cara">
          <path d="M48 52 Q55 48 62 52" stroke="#5C3A21" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M88 52 Q95 48 102 52" stroke="#5C3A21" stroke-width="3" fill="none" stroke-linecap="round"/>
          
          <g id="ojos-abiertos">
            <circle cx="55" cy="64" r="7" fill="#2B2D42"/>
            <circle cx="53" cy="61" r="2.5" fill="#FFF"/>
            <circle cx="95" cy="64" r="7" fill="#2B2D42"/>
            <circle cx="93" cy="61" r="2.5" fill="#FFF"/>
          </g>

          <g id="ojos-cerrados" style="display: none;">
            <path d="M47 65 Q55 72 63 65" stroke="#2B2D42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M87 65 Q95 72 103 65" stroke="#2B2D42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>

          <ellipse cx="45" cy="74" rx="6" ry="3.5" fill="#FF8FA3" opacity="0.6"/>
          <ellipse cx="105" cy="74" rx="6" ry="3.5" fill="#FF8FA3" opacity="0.6"/>

          <path id="boca" d="M67 78 Q75 87 83 78" stroke="#C92A2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>

        <g id="capa-pelo-frontal"></g>

        <g id="corona-puesta" style="display: none;">
          <polygon points="48,20 52,2 65,12 75,-2 85,12 98,2 102,20" fill="#FFD166" stroke="#F4A261" stroke-width="2"/>
        </g>
      </svg>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
